[package]
name = "sth-dictate"
version = "0.4.0"
edition = "2024"
description = "Dictation against your own Whisper server, for Linux: hold or tap a key, speak, and the text is pasted at your cursor"
license = "MIT"
publish = false

[workspace]
members = ["voice"]

[dependencies]
sth-voice = { path = "voice" }
evdev = "0.13"
ksni = { version = "0.3.7", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
